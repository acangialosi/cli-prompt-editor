name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test PromptEditor.sln -c Release
      - name: Publish portable Windows app
        run: dotnet publish src\PromptEditor\PromptEditor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts\PromptEditor
      - uses: actions/upload-artifact@v4
        with:
          name: PromptEditor-win-x64
          path: artifacts/PromptEditor/
